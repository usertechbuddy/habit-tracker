<!DOCTYPE html>
<head>
    <title>Habit Tracker | Dev Weekends</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>📅 Habit Tracker</h1>
            <p class="subtitle">Build streaks. Stay consistent.</p>
        </header>

        <div class="add-habit-section">
            <input type="text" id="habitNameInput" placeholder="e.g., Read 30 min, Exercise, Meditate..." maxlength="50">
            <button id="addHabitBtn" class="btn btn-primary">+ Add Habit</button>
        </div>

        <div class="week-nav">
            <button id="prevWeekBtn" class="btn btn-secondary">← Previous</button>
            <div class="week-info">
                <span id="weekRange"></span>
                <button id="todayBtn" class="btn btn-outline">Today</button>
            </div>
            <button id="nextWeekBtn" class="btn btn-secondary">Next →</button>
        </div>

        <div class="grid-wrapper">
            <div class="habit-grid" id="habitGrid"> </div>
        </div>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📋</div>
            <h3>No habits yet</h3>
            <p>Add your first habit above to start tracking your progress.</p>
            <button id="emptyAddBtn" class="btn btn-primary">+ Add Your First Habit</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
